name: Resumen diario del bebé (Telegram)

on:
  schedule:
    # Todos los días a las 07:30 UTC (08:30 en invierno / 09:30 en verano en España)
    - cron: '30 7 * * *'
  workflow_dispatch:

jobs:
  enviar-resumen:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de resumen diario
        run: |
          curl --fail --show-error --silent \
            -X POST "${{ secrets.API_URL }}/api/cron/resumen-bebe" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
